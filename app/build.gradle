plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.potraderbot'
    compileSdk 36

    defaultConfig {
        def supabaseUrl = System.getenv("SUPABASE_URL") ?: ""
        def supabaseAnonKey = System.getenv("SUPABASE_ANON_KEY") ?: ""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '0.6.3'
    }

    buildFeatures {
        buildConfig true
    }

    // Keep the stable signing key used by the installed v0.5.9 release.
    if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0'
}
