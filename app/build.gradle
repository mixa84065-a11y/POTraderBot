import java.util.Properties

plugins {
    id 'com.android.application'
}

def localSecrets = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localSecrets.load(it) }
}
def asBuildConfigString = { value ->
    '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.potraderbot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'TWELVE_DATA_API_KEY', asBuildConfigString(localSecrets.getProperty('TWELVE_DATA_API_KEY', ''))
        buildConfigField 'String', 'API_SH_KEY', asBuildConfigString(localSecrets.getProperty('API_SH_KEY', ''))
    }

    buildFeatures {
        buildConfig true
    }
}
