plugins {
    id 'com.android.application'
}

android {
    namespace 'com.potraderbot'
    buildFeatures {
        buildConfig true
    }
    compileSdk 36

    defaultConfig {
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '0.5.6'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            def ksPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS")
            def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
