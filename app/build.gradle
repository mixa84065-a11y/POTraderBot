plugins {
    id 'com.android.application'
}

android {
    namespace 'com.potraderbot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0'
}
