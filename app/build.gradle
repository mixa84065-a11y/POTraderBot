plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.potraderbot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.3.2'
    }

    buildFeatures {
        buildConfig true
    }

    // Configure release signing only when CI restored the private keystore.
    if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0'
}
