plugins {
    id 'com.android.application'
}

android {
    namespace 'com.potraderbot'
    buildFeatures {
        buildConfig true
    }
    compileSdk 36

    defaultConfig {
        applicationId 'com.potraderbot'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
