name: Android dashboard smoke and screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feature/analytics-dashboard
    paths:
      - 'src/main/**'
      - 'src/androidTest/**'
      - 'build.gradle'
      - '.github/workflows/dashboard-smoke.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare temporary test-only signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/ui-smoke.jks" -storepass android -keypass android -alias ui-smoke -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Temporary UI test"
      - name: Assemble app and instrumentation APKs (test key only)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ui-smoke.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: ui-smoke
          ANDROID_KEY_PASSWORD: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          TOOLS="$(dirname "$SDKMANAGER")"
          test -x "$TOOLS/avdmanager"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          export PATH="$SDK/platform-tools:$SDK/emulator:$TOOLS:$PATH"
          printf '%s\n' "$SDK/platform-tools" "$SDK/emulator" "$TOOLS" >> "$GITHUB_PATH"
          printf 'no\n' | "$TOOLS/avdmanager" create avd --force --name dashboard-smoke --package "system-images;android-35;google_apis;x86_64"
          nohup "$SDK/emulator/emulator" -avd dashboard-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install test builds and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-smoke
          APP="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          TEST="$(find build/outputs/apk/androidTest/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APP" && test -n "$TEST"
          adb install "$APP"
          adb install "$TEST"
          PKG=com.potraderbot.godoftrading2standalone
          for SIZE in 1080x2160 1179x2556; do
            adb shell wm size "$SIZE"
            adb shell wm density 480
            adb shell am force-stop "$PKG"
            adb shell pm clear "$PKG"
            adb shell input keyevent 82
            adb shell am instrument -w -r "$PKG.test/com.potraderbot.DashboardSmokeRunner" | tee "ui-smoke/$SIZE-instrumentation.txt"
            grep -q DASHBOARD_SMOKE_OK "ui-smoke/$SIZE-instrumentation.txt"
            for SCREEN in login dashboard dashboard-bottom; do
              adb exec-out run-as "$PKG" cat "files/ui-smoke-$SCREEN.png" > "ui-smoke/$SIZE-$SCREEN.png"
              test -s "ui-smoke/$SIZE-$SCREEN.png"
            done
          done
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ui-smoke
          adb logcat -d -t 1000 > ui-smoke/logcat.txt || true
          cp "$RUNNER_TEMP/emulator.log" ui-smoke/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOD-OF-TRADING-dashboard-smoke
          path: ui-smoke/
          if-no-files-found: warn
          retention-days: 14
