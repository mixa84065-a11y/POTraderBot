name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/binarium-data-engine

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require stable release signing key
        shell: bash
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "Stable Android release keystore is required; refusing to publish an incompatible debug APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dedgod-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dedgod-release.jks" >> "$GITHUB_ENV"

      - name: Validate Supabase registration configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::GitHub Secret SUPABASE_URL is missing."
            exit 1
          fi
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_URL="${SUPABASE_URL%/}"
          if [ "$SUPABASE_URL" != "https://srzemjqjgceoebvimmct.supabase.co" ]; then
            echo "::error::SUPABASE_URL does not match the configured GOD-OF-TRADING project."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub Secret SUPABASE_ANON_KEY is missing."
            exit 1
          fi
          HTTP_CODE=$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-auth-settings.json" --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/settings")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Supabase rejected the configured URL/API key (HTTP $HTTP_CODE)."
            exit 1
          fi
          echo "Supabase Auth endpoint accepted the configured public API key. Secret values are not printed."

      - name: Build signed release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Read and enforce app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/ {print $2; exit}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/ {gsub(/[^0-9]/, "", $0); print; exit}' app/build.gradle)
          if [ "$VERSION_NAME" != "0.6.4" ] || [ "$VERSION_CODE" != "16" ]; then
            echo "Unexpected app version: name=$VERSION_NAME code=$VERSION_CODE"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned APK filename
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DeD_GoD-v${{ steps.app_version.outputs.version }}.apk"
          ls -lah dist/

      - name: Validate APK signature, package, and upgrade compatibility
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          test -x "$AAPT"

          SIGNATURE_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE_OUTPUT"
          EXPECTED_CERT="a8e8a01ac8da1ecd897b53c544ce6915f5968ccdc4c2e2e4c7626c20e8c0ceb0"
          ACTUAL_CERT=$(printf '%s\n' "$SIGNATURE_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Signing certificate mismatch. Refusing to publish update."
            exit 1
          fi

          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          PACKAGE_LINE=$(printf '%s\n' "$BADGING" | grep "^package:")
          [[ "$PACKAGE_LINE" == *"name='com.potraderbot'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='16'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='0.6.4'"* ]]
          echo "APK_VALIDATION=passed; signer matches installed v0.5.9; versionCode=16"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeD_GoD-v${{ steps.app_version.outputs.version }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Release publishing is intentionally held until all v0.6.4 features pass validation.
