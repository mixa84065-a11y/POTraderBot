name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-paper-trading
      - feature/binarium-data-engine

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable Android signing key
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dedgod-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dedgod-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK (temporary until signing key is configured)
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Не удалось определить versionName из app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned APK filename
        shell: bash
        run: |
          mkdir -p dist
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/DeD_GoD-v${{ steps.app_version.outputs.version }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/DeD_GoD-v${{ steps.app_version.outputs.version }}-debug.apk"
          fi
          ls -lah dist/

      - name: Validate APK signature and Android package
        shell: bash
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -n "$APK" && test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          echo "APK_VALIDATION=passed"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeD_GoD-v${{ steps.app_version.outputs.version }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK to GitHub Releases
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: DeD_GoD ${{ steps.app_version.outputs.tag }}
          files: dist/*.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true

      - name: Publish temporary debug APK to GitHub Releases
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: DeD_GoD ${{ steps.app_version.outputs.tag }} (debug signing)
          files: dist/*.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
