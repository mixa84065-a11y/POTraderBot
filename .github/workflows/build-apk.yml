name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/live-paper-trading

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable Android signing key
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dedgod-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dedgod-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK (temporary until signing key is configured)
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload signed APK artifact
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DeD_GoD-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload temporary debug APK artifact
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DeD_GoD-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Не удалось определить versionName из app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK to GitHub Releases
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: DeD_GoD ${{ steps.app_version.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true

      - name: Publish temporary debug APK to GitHub Releases
        if: ${{ env.SIGNING_CONFIGURED != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: DeD_GoD ${{ steps.app_version.outputs.tag }} (debug signing)
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true

      - name: Capture app screen on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            if [ "$SIGNING_CONFIGURED" = "true" ]; then
              APK_PATH=app/build/outputs/apk/release/app-release.apk
            else
              APK_PATH=app/build/outputs/apk/debug/app-debug.apk
            fi
            adb install "$APK_PATH"
            adb shell am force-stop com.potraderbot || true
            adb shell am start -n com.potraderbot/.MainActivity
            sleep 12
            adb shell screencap -p /sdcard/god-of-trading.png
            adb pull /sdcard/god-of-trading.png ./god-of-trading.png

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GOD-OF-TRADING-emulator-screenshot
          path: god-of-trading.png
          if-no-files-found: error
          retention-days: 14
