name: GOD OF TRADING 2.0 Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/god-of-trading-2.0

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build isolated 2.0 debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK artifact only after tests pass
        uses: actions/upload-artifact@v4
        with:
          name: GOD-OF-TRADING-2-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
