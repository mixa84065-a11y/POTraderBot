name: GOD OF TRADING 2.0 Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/god-of-trading-2.0

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/god-of-trading-upload.jks"
          test -s "$RUNNER_TEMP/god-of-trading-upload.jks"
      - name: Run unit tests and build persistently signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/god-of-trading-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload persistently signed APK only after tests pass
        uses: actions/upload-artifact@v4
        with:
          name: GOD-OF-TRADING-2-signed
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
