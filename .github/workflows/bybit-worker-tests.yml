name: Bybit demo worker tests

on:
  push:
    branches:
      - feature/god-of-trading-2.0
    paths:
      - "supabase/functions/bybit-demo-worker/**"
      - ".github/workflows/bybit-worker-tests.yml"
  pull_request:
    branches:
      - feature/god-of-trading-2.0
    paths:
      - "supabase/functions/bybit-demo-worker/**"
      - ".github/workflows/bybit-worker-tests.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check worker helpers and tests
        run: deno check supabase/functions/bybit-demo-worker/bybit.ts supabase/functions/bybit-demo-worker/execution.ts supabase/functions/bybit-demo-worker/bybit_test.ts
      - name: Run Bybit worker unit tests
        run: deno test --allow-env supabase/functions/bybit-demo-worker/bybit_test.ts
